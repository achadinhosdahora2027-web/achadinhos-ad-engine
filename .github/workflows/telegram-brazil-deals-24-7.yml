name: Telegram Ofertas Brasil 24/7 Autopilot (Multi-Destino)

on:
  schedule:
    # Picos de compra do Brasil (UTC) = 08h,11h,14h,17h,20h,23h,02h em Brasilia
    - cron: "0 11,14,17,20,22,0,2 * * *"
    # Rede de seguranca: a cada hora, garante que o ciclo nunca fica vazio
    - cron: "25 * * * *"
  workflow_dispatch:
    inputs:
      discover_only:
        description: "Apenas descobrir chat_id de grupos novos (nao publica)"
        type: boolean
        default: false

concurrency:
  group: telegram-deals-publisher
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_DEALS_CHANNEL: ${{ secrets.TELEGRAM_DEALS_CHANNEL }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  AFFILIATE_GATEWAY: "https://achadinhos-ad-engine.vercel.app/api/ads/go"

jobs:
  publish-brazil-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: "1. Descobrir chat_id de grupos pendentes (se houver)"
        run: node scripts/telegram-brazil-deals-publisher.js --discover-only || true

      - name: "2. Publicar oferta em TODOS os destinos (canal + grupos + admin)"
        if: ${{ inputs.discover_only != true }}
        run: node scripts/telegram-brazil-deals-publisher.js
      - name: "4. Publicar ofertas Shopee REAIS (inventario v330.0: 701 ofertas)"
        if: ${{ inputs.discover_only != true }}
        run: |
          if [ -f data/shopee-offer-links.json ]; then
            node scripts/publish-shopee-v330-deals.js --limit 3 || echo "publicacao Shopee falhou (nao bloqueia o restante)"
          else
            echo "inventario Shopee ausente - pule"
          fi

      - name: "5. Entrega delegada ao Job 60 v420 (10s)"
        if: always()
        run: |
          # O runner apenas materializa ofertas na fonte C2. O Job 60 do mestre
          # consolida e envia; chamar o flush legado aqui reabriria a corrida dupla.
          echo "v420: sem fan-out e sem flush HTTP concorrente"


      - name: "3. Persistir historico anti-repeticao"
        if: always()
        run: |
          git config user.name "telegram-autopilot[bot]"
          git config user.email "telegram-autopilot@users.noreply.github.com"
          if [ -f data/telegram-published-deals-history.json ]; then
            git add data/telegram-published-deals-history.json data/shopee-v330-publish-report.json 2>/dev/null || true
              git add data/telegram-published-deals-history.json
            git add data/telegram-destinations.json 2>/dev/null || true
            if ! git diff --staged --quiet; then
              git commit -m "chore(telegram): historico de publicacao 24/7 [skip ci]"
              git pull --rebase --autostash origin main || true
              git push origin main || echo "push falhou (sem impacto na entrega)"
            else
              echo "Nada a persistir."
            fi
          fi
