name: Master Autonomous Hierarchical Orchestrator 24/7 (Full Growth & Watchdog)

on:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_DEALS_CHANNEL: ${{ secrets.TELEGRAM_DEALS_CHANNEL }}
  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
  TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
  TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
  TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET_TOKEN: ${{ secrets.META_APP_SECRET_TOKEN }}
  META_MASTER_USER_TOKEN: ${{ secrets.META_MASTER_USER_TOKEN }}
  META_PAGE_TOKEN_A: ${{ secrets.META_PAGE_TOKEN_A }}
  META_PAGE_TOKEN_B: ${{ secrets.META_PAGE_TOKEN_B }}
  META_PAGE_TOKEN_2: ${{ secrets.META_PAGE_TOKEN_2 }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 1. Execute Autonomous Council & Hierarchical Governance Audit
        run: |
          node scripts/autonomous-hierarchical-governance-engine.js || true

      - name: 2. Run Autonomous Memory Ledger & Dynamic Escalation Engine
        run: |
          node scripts/autonomous-memory-ledger-engine.js || true

      - name: 3. Run 24/7 Affiliate Impressions, Clicks & Pixel Integrity Watchdog
        run: |
          node scripts/affiliate-impressions-and-links-watchdog.js || true

      - name: 4. Execute Controlled High-Impact 15-Offer Production & Dynamic Scale
        run: |
          node scripts/controlled-production-learning-engine.js || true

      - name: 5. Execute 300,000 Ultra Robots Planetary Social Capture Mega-Swarm (195 Countries)
        run: |
          node scripts/ultra-300k-planetary-swarm-engine.js || true

      - name: 6. Run Pinterest Rich Pin & Vertical Visual Syndication Engine
        run: |
          node scripts/pinterest-rich-pin-engine.js || true

      - name: 7. Run Meta Commerce & Instagram Shop Catalog Sync
        run: |
          node scripts/meta-commerce-catalog-sync.js || true

      - name: 8. Run Tarot 3D & Cosmic Forecast Viral Traffic Magnet
        run: |
          node scripts/tarot-viral-traffic-magnet.js || true

      - name: 9. Run Google Search Console & SEO Health Optimizer
        run: |
          node scripts/google-search-console-optimizer.js || true

      - name: 10. Run Multi-Engine Global Search Indexing Pinger (IndexNow & Global)
        run: |
          node scripts/multi-engine-global-pinger.js || true

      - name: 11. Run Coupon Freshness & Live Price Drop Radar
        run: |
          node scripts/coupon-radar-validator.js || true

      - name: 12. Run Canário Affiliate & Self-Healing Guard
        run: |
          node scripts/affiliate-health-check.js || true

      - name: 13. Refresh Tag SEO & Intent Pages
        run: |
          node scripts/generate-tag-seo-pages.js || true

      - name: 14. Refresh Facebook Groups Viral Syndication
        run: |
          node scripts/facebook-group-syndication-engine.js || true

      - name: 15. Run Spintax Anti-Ban Comment Responder
        run: |
          node scripts/instagram-comments-auto-responder.js || true

      - name: 16. Execute Twitter / X Viral Publisher & Multi-Country Syndication
        run: |
          node scripts/twitter-global-viral-publisher.js || true
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
          TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

      - name: 17. Dispatch 24/7 Consolidated Live Executive Digest to Telegram
        run: |
          node scripts/telegram-autonomous-notifier.js || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: 18. Execute Master Global Omni-Test Suite (195 Countries)
        run: |
          node scripts/master-global-omni-test-suite.js || true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          MANYCHAT_API_TOKEN: ${{ secrets.MANYCHAT_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
