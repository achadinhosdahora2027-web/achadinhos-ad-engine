name: Master Autonomous Hierarchical Orchestrator 24/7 (Full Growth & Watchdog)

# ==============================================================================
# POR QUE ESTE WORKFLOW MUDOU (auditoria de 13/09/2026)
# ------------------------------------------------------------------------------
# 1) Ele clonava UM repositorio so. O orquestrador mestre e um sistema de DOIS
#    repositorios lado a lado: os scripts do site importam
#        ../../achadinhos-ad-engine/data/*.json
#    Por isso 4 etapas legitimas (canario de afiliados, tags SEO, sindicacao,
#    omni-teste) nunca conseguiam rodar no CI — nao era o script que faltava,
#    era o repositorio vizinho.
# 2) Cada etapa era executada como `node scripts/x.js || true`. O `|| true`
#    escondia erro de sintaxe, modulo ausente e token faltando. O job ficava
#    verde dizendo "SISTEMA 100% ALINHADO 24/7" com 5 etapas que nao rodavam.
#    Agora quem executa e scripts/orchestrator-run.sh, que classifica cada etapa
#    em OK / AUSENTE / FALHOU e deixa o job VERMELHO quando algo real quebra.
# 3) O workflow nunca carregava as credenciais nas etapas que precisavam delas
#    (o entregador do Telegram falhava com "TELEGRAM_BOT_TOKEN ausente" mesmo
#    com o secret configurado no repositorio). Agora o bloco `env:` desce os
#    secrets para o processo.
# ==============================================================================

on:
  schedule:
    - cron: "0 */2 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: orchestrator-mestre
  cancel-in-progress: false

permissions:
  contents: write

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_DEALS_CHANNEL: ${{ secrets.TELEGRAM_DEALS_CHANNEL }}
  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
  TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
  TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
  TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET_TOKEN: ${{ secrets.META_APP_SECRET_TOKEN }}
  META_MASTER_USER_TOKEN: ${{ secrets.META_MASTER_USER_TOKEN }}
  META_PAGE_TOKEN_A: ${{ secrets.META_PAGE_TOKEN_A }}
  META_PAGE_TOKEN_B: ${{ secrets.META_PAGE_TOKEN_B }}
  META_PAGE_TOKEN_2: ${{ secrets.META_PAGE_TOKEN_2 }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
  CJ_CID: ${{ secrets.CJ_CID }}
  BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
  YANDEX_OAUTH_CLIENT_ID: ${{ secrets.YANDEX_OAUTH_CLIENT_ID }}
  YANDEX_OAUTH_CLIENT_SECRET: ${{ secrets.YANDEX_OAUTH_CLIENT_SECRET }}
  YANDEX_OAUTH_ACCESS_TOKEN: ${{ secrets.YANDEX_OAUTH_ACCESS_TOKEN }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  AFFILIATE_GATEWAY: ${{ secrets.AFFILIATE_GATEWAY }}

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout do motor (achadinhos-ad-engine)
        uses: actions/checkout@v4
        with:
          path: achadinhos-ad-engine
          token: ${{ secrets.GH_PAT }}

      - name: Checkout do site (aquitemachadinhos)
        uses: actions/checkout@v4
        with:
          repository: achadinhosdahora2027-web/aquitemachadinhos
          path: aquitemachadinhos
          token: ${{ secrets.GH_PAT }}

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar orquestracao autonoma (diagnostico honesto)
        env:
          SITE_REPO: ${{ github.workspace }}/aquitemachadinhos
          CHECK_LIVE: "1"
        run: bash achadinhos-ad-engine/scripts/orchestrator-run.sh

      - name: Guardar relatorios gerados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-orquestrador
          path: |
            achadinhos-ad-engine/data/affiliate-health-report.json
            achadinhos-ad-engine/data/telegram-published-deals-history.json
            aquitemachadinhos/data/instagram-reply-drafts.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commitar dados atualizados pelo motor
        if: success()
        run: |
          cd achadinhos-ad-engine
          git config user.name "orchestrator-bot"
          git config user.email "orchestrator-bot@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "Nada novo para commitar."
          else
            git commit -m "chore(orquestrador): dados atualizados em $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          fi
