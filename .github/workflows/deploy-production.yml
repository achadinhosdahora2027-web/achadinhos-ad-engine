name: Deploy Production (Vercel CLI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Affiliate Gateway Tests
        run: |
          node tests/go.test.js
          node tests/currency.test.js

      - name: Link Vercel Project
        run: npx -y vercel@latest link --yes --project achadinhos-ad-engine --scope aqui-tem-achadinhos --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        run: npx -y vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope aqui-tem-achadinhos
