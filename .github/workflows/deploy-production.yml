name: Deploy Production (Vercel CLI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TELEGRAM_DEALS_CHANNEL: ${{ secrets.TELEGRAM_DEALS_CHANNEL }}
  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
  TWITTER_CONSUMER_KEY: ${{ secrets.TWITTER_CONSUMER_KEY }}
  TWITTER_CONSUMER_SECRET: ${{ secrets.TWITTER_CONSUMER_SECRET }}
  TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET_TOKEN: ${{ secrets.META_APP_SECRET_TOKEN }}
  META_MASTER_USER_TOKEN: ${{ secrets.META_MASTER_USER_TOKEN }}
  META_PAGE_TOKEN_A: ${{ secrets.META_PAGE_TOKEN_A }}
  META_PAGE_TOKEN_B: ${{ secrets.META_PAGE_TOKEN_B }}
  META_PAGE_TOKEN_2: ${{ secrets.META_PAGE_TOKEN_2 }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Affiliate Gateway Tests
        run: |
          node tests/go.test.js
          node tests/currency.test.js

      - name: Link Vercel Project
        run: npx -y vercel@latest link --yes --project achadinhos-ad-engine --scope aqui-tem-achadinhos --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Production
        run: npx -y vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope aqui-tem-achadinhos
