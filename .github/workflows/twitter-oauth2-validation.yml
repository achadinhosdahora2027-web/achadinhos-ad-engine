name: Twitter OAuth2 Validation (on-demand)

on:
  workflow_dispatch:
    inputs:
      test_client_id:
        description: "Client ID alternativo para teste (opcional)"
        required: false
        default: ""
      test_client_secret:
        description: "Client Secret alternativo para teste (opcional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar par OAuth2 + refresh + escopos
        run: |
          pip install pynacl -q
          python scripts/twitter-oauth2-validate.py
        env:
          TEST_CLIENT_ID: ${{ github.event.inputs.test_client_id }}
          TEST_CLIENT_SECRET: ${{ github.event.inputs.test_client_secret }}
          VAULTED_TWITTER_OAUTH2_CLIENT_ID: ${{ secrets.TWITTER_OAUTH2_CLIENT_ID }}
          VAULTED_TWITTER_OAUTH2_CLIENT_SECRET: ${{ secrets.TWITTER_OAUTH2_CLIENT_SECRET }}
          TWITTER_OAUTH2_ACCESS_TOKEN: ${{ secrets.TWITTER_OAUTH2_ACCESS_TOKEN }}
          TWITTER_OAUTH2_REFRESH_TOKEN: ${{ secrets.TWITTER_OAUTH2_REFRESH_TOKEN }}
          TWITTER_OAUTH2_CLIENT_ID: ${{ secrets.TWITTER_OAUTH2_CLIENT_ID }}
          TWITTER_OAUTH2_CLIENT_SECRET: ${{ secrets.TWITTER_OAUTH2_CLIENT_SECRET }}
          GITHUB_PAT: ${{ secrets.ROTATION_PAT }}
