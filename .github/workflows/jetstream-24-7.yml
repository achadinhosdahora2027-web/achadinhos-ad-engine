name: Traffic Core v1510 — WebSockets assinados (janela contínua)

on:
  schedule:
    # Orquestra uma janela event-driven por hora. Isto NÃO é polling de dados e
    # não é descrito como SLA de processo permanente: runners hospedados têm fim.
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Duração da janela WebSocket (0 = até o limite do runner)"
        default: "3300"
        type: string
      dry_run:
        description: "Conectar e filtrar sem gravar no mestre"
        default: true
        type: boolean

concurrency:
  group: traffic-core-v1510-rolling-worker
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  NEXUS_INGEST_HMAC: ${{ secrets.NEXUS_INGEST_HMAC }}
  JETSTREAM_URL: "wss://jetstream2.us-east.bsky.network/subscribe?wantedCollections=app.bsky.feed.post"
  NOSTR_RELAYS: "wss://nos.lol,wss://relay.damus.io"

jobs:
  consume-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Instalar dependências travadas
        run: npm ci --no-audit --no-fund
      - name: Consumir Jetstream e Nostr via RFC 6455
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ inputs.dry_run || github.event_name == 'schedule' && false }}" = "true" ]; then EXTRA="--dry"; fi
          node workers/traffic-core-v1510.js --seconds "${{ inputs.seconds || 3300 }}" $EXTRA
      - name: Registrar término real da janela
        if: always()
        run: echo "v1510 runner status=${{ job.status }}; permanência não alegada; contadores estão no log do worker"
